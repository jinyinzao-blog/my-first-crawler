<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CRAWLER_DATA // RETRO_POP</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-blue: #5C97D4;
            --panel-blue: #85B9E0;
            --accent-orange: #FF7B00;
            --accent-yellow: #FFD700;
            --text-black: #111111;
            --white: #FFFFFF;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }

        /* 经典的几何拼接背景 */
        body {
            background-color: var(--bg-blue);
            background-image: 
                linear-gradient(var(--white) 15px, transparent 15px),
                linear-gradient(90deg, var(--white) 15px, transparent 15px),
                radial-gradient(circle at 10% 20%, var(--bg-blue) 50%, transparent 50%),
                radial-gradient(circle at 90% 80%, var(--bg-blue) 50%, transparent 50%);
            background-size: 200px 200px, 200px 200px, 300px 300px, 300px 300px;
            background-position: 0 0, 0 0, 0 0, 50px 50px;
            color: var(--text-black);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper { width: 100%; max-width: 1100px; display: flex; flex-direction: column; gap: 30px; }

        /* 头部 */
        .header {
            background-color: var(--white);
            border: 4px solid var(--text-black);
            box-shadow: 8px 8px 0 var(--text-black);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transform: rotate(-1deg);
        }
        .header h1 { font-family: 'Archivo Black', sans-serif; font-size: 32px; letter-spacing: 2px; text-transform: uppercase; }
        .header .badge { background-color: var(--accent-orange); color: var(--white); padding: 5px 15px; font-weight: bold; border: 3px solid var(--text-black); border-radius: 20px; font-size: 14px; }

        /* 数据卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .stat-card { background-color: var(--panel-blue); border: 4px solid var(--text-black); box-shadow: 6px 6px 0 var(--text-black); padding: 25px; position: relative; transition: transform 0.2s; }
        .stat-card:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--text-black); }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 10px; background: repeating-linear-gradient(90deg, var(--text-black), var(--text-black) 2px, transparent 2px, transparent 4px); }
        .stat-card h3 { font-size: 14px; text-transform: uppercase; margin-bottom: 10px; margin-top: 10px; font-weight: 700;}
        .stat-value { font-family: 'Archivo Black', sans-serif; font-size: 42px; color: var(--text-black); }
        #status-container { background-color: var(--panel-blue); }
        #status-container .stat-value { color: var(--text-black); }

        /* 表格 */
        .table-panel { background-color: var(--white); border: 4px solid var(--text-black); box-shadow: 10px 10px 0 var(--text-black); overflow: hidden; }
        .table-header { background-color: var(--text-black); color: var(--white); padding: 15px 25px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .table-header .dots span { display: inline-block; width: 12px; height: 12px; background: var(--white); border-radius: 50%; margin-left: 8px; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 18px 25px; text-align: left; border-bottom: 3px solid var(--text-black); font-size: 15px; vertical-align: middle; }
        th { background-color: var(--panel-blue); font-family: 'Archivo Black', sans-serif; text-transform: uppercase; border-bottom: 4px solid var(--text-black); }
        
        tr:hover { background-color: var(--accent-orange); color: var(--white); }
        tr:hover .td-title { color: var(--white); }
        
        .td-title { font-weight: 700; color: var(--text-black); }
        .td-price { font-weight: bold; font-size: 18px; }

        /* 波普评分标签 */
        .td-rating span {
            display: inline-block;
            background-color: var(--accent-yellow);
            color: var(--text-black);
            padding: 4px 12px;
            font-weight: 900;
            text-transform: uppercase;
            border: 2px solid var(--text-black);
            box-shadow: 3px 3px 0 var(--text-black);
            border-radius: 4px;
            font-size: 13px;
        }
        tr:hover .td-rating span {
            background-color: var(--white);
            color: var(--text-black);
            box-shadow: 3px 3px 0 var(--accent-orange);
        }

        @media (max-width: 900px) {
            .stats-grid { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <header class="header">
            <h1>CRAWLER DATA</h1>
            <div class="badge">STATIC_MOCKUP</div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <h3>TOTAL_BOOKS</h3>
                <div class="stat-value" id="total-books">--</div>
            </div>
            <div class="stat-card">
                <h3>AVG_PRICE_GBP</h3>
                <div class="stat-value" id="avg-price">--</div>
            </div>
            <div class="stat-card" id="status-container">
                <h3>DATA_LINK</h3>
                <div class="stat-value" id="status">WAIT</div>
            </div>
        </section>

        <section class="table-panel">
            <div class="table-header">
                <span>DATABASE_VIEW.JSON</span>
                <div class="dots"><span></span><span></span><span></span></div>
            </div>
            
            <table id="book-table">
                <thead>
                    <tr>
                        <th>TITLE</th>
                        <th>PRICE</th>
                        <th>RATING</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="3" style="text-align: center; font-weight: bold;">LOADING DATA...</td></tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        // 1. 直接把刚才爬下来的数据写死在这里，不需要读本地 JSON 文件了
        const bookData = [
            { title: "A Light in the Attic", price: "£51.77", rating: "Three" },
            { title: "Tipping the Velvet", price: "£53.74", rating: "One" },
            { title: "Soumission", price: "£50.10", rating: "One" },
            { title: "Sharp Objects", price: "£47.82", rating: "Four" },
            { title: "Sapiens: A Brief History of Humankind", price: "£54.23", rating: "Five" },
            { title: "The Requiem Red", price: "£22.65", rating: "One" },
            { title: "The Dirty Little Secrets of Getting Your Dream Job", price: "£33.34", rating: "Four" },
            { title: "The Coming Woman", price: "£17.93", rating: "Three" },
            { title: "The Boys in the Boat", price: "£22.60", rating: "Four" },
            { title: "The Black Maria", price: "£52.15", rating: "One" }
        ];

        // 2. 计算统计数据
        document.getElementById('total-books').innerText = bookData.length;
        
        let totalPrice = 0;
        bookData.forEach(book => {
            totalPrice += parseFloat(book.price.replace('£', ''));
        });
        document.getElementById('avg-price').innerText = (totalPrice / bookData.length).toFixed(2);

        document.getElementById('status').innerText = 'ONLINE';

        // 3. 渲染表格
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = ''; 
        
        bookData.forEach((book, index) => {
            // 加个小延迟，让表格一行行弹出来，有动画感
            setTimeout(() => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="td-title">${book.title}</td>
                    <td class="td-price">${book.price}</td>
                    <td class="td-rating"><span>${book.rating}</span></td>
                `;
                tbody.appendChild(tr);
            }, index * 50);
        });
    </script>
</body>
</html>
